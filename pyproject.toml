[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mcda-studio"
version = "0.1.0"
description = "Local additive MAVT application and generic decision-analysis engine."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sooyoung Park" }]
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "fastapi>=0.115",   # the API is part of the quality gates
    "uvicorn>=0.30",
    "httpx>=0.27",      # FastAPI's TestClient
    "pytest>=8",
    "hypothesis>=6.100",
    "scipy>=1.11",   # independent cross-checks only (brentq, linear algebra); not a runtime dependency
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/spar473/mcda-studio"
Documentation = "https://github.com/spar473/mcda-studio/tree/main/docs"

[project.scripts]
mcda = "mcda_studio.cli:app"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/requirements", "/examples/*/project.json",
    "/examples/starter_templates", "/examples/external_proposals", "/examples/market_research",
    "/examples/classifier_benchmark", "/docs/schemas",
    "/examples/*/README.md", "/examples/*/build.py", "/examples/*/expected*.json",
    "/frontend/src", "/frontend/public", "/frontend/scripts", "/frontend/tests",
    "/frontend/e2e", "/frontend/*.json", "/frontend/*.ts", "/frontend/*.js",
    "/frontend/index.html", "/frontend/README.md", "/docs/api", "/docs/architecture",
    "/docs/development/testing.md", "/hatch_build.py", "/README.md", "/LICENSE",
    "/ACKNOWLEDGEMENTS.md", "/CHANGELOG.md", "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcda_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
markers = [
    "regression: reproduces documented reference-study numbers",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["mcda_studio"]
known-local-folder = ["builders"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
